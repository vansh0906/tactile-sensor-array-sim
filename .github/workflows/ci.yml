name: tests-and-requirements
on: [push, pull_request]
jobs:
  run:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests.py
      - name: All experiments; fails if any requirement fails
        run: python run_all.py | tee results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            results.txt
            results.png
            spice/*.cir
